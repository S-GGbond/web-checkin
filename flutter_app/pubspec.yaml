name: checkin_hub
description: "WorkBuddy / Trae 多账号签到中枢的 Flutter 跨端客户端。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.2

  # 网络
  http: ^1.2.2

  # 本地账号库（移动端用 sqflite，桌面端用 ffi 实现）
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 加密原语：Trae 登录态加密容器（AES-128-CBC + SHA-512）与 RSA 设备信息
  pointycastle: ^3.9.1

  # 打开平台授权页面
  url_launcher: ^6.3.1

  # 时间格式化
  intl: ^0.20.2
  android_alarm_manager_plus: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
