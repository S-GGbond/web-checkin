name: checkin_hub
description: "WorkBuddy / Trae 多账号签到中枢的 Flutter 跨端客户端。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.2

  # 网络
  http: ^1.2.2

  # 本地账号库（移动端用 sqflite，桌面端用 ffi 实现）
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 加密原语：Trae 登录态加密容器（AES-128-CBC + SHA-512）与 RSA 设备信息
  pointycastle: ^3.9.1

  # 打开平台授权页面
  url_launcher: ^6.3.1

  # 时间格式化
  intl: ^0.20.2
  android_alarm_manager_plus: ^5.1.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# sqlite3 的预编译 DLL 默认从 GitHub Releases 下载，本机直连不通（CONNECT 被代理拒绝），
# 改走镜像。钩子下载后会强制校验 SHA256（见 sqlite3 包 asset_hashes.dart），镜像无法篡改内容。
hooks:
  user_defines:
    sqlite3:
      url_pattern: "https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
